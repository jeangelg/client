<button (click)="volver()" class="btn btn-secondary">
    ← Volver
</button>

<div class="flex justify-center items-center p-2">

    <div class="card bg-base-100 w-full max-w-md shrink-0 shadow-2xl">
        <form [formGroup]="nuevoPedidoForm" class="card-body">

        <app-input-text  label="Cuenta Clave:" placeHolder="Cuenta Clave" formControlName="cuentaClave"  type="text"/>   

        <app-input-text  label="Cliente:" formControlName="cliente" type="text"/>   

        <app-input-text  label="Cliente CodOpe:" formControlName="clienteCodOpe" type="text"/>   

        <app-input-text  label="Codope:" formControlName="codope" type="text"/>   

        <app-input-text  label="Centro:" formControlName="centro" type="text"/>   

        <app-input-text  label="Gln Proveedor:" formControlName="glnProveedor" type="text"/>   

        <app-input-text  label="Gln Sucursal:" formControlName="glnSucursal" type="text"/>   

      <div class="form-control flex items-center space-x-2">
        <label class="w-30 text-right">PTAuto:</label>
        <div class="flex items-center space-x-4">
          <label class="flex items-center">
            <input
              type="radio"
              class="w-4 h-4"
              value="si"
              formControlName="ptAuto"
            />
            <span class="ms-2 text-sm">Sí</span>
          </label>

          <label class="flex items-center">
            <input
              type="radio"
              class="w-4 h-4"
              value="no"
              formControlName="ptAuto"
            />
            <span class="ms-2 text-sm">No</span>
          </label>
        </div>
      </div> 

      <div class="form-control mt-6">
        <button class="btn btn-primary" type="submit" [disabled]="nuevoPedidoForm.invalid">
          Guardar
        </button>
      </div>
        </form>
    </div>

</div>
